name: Deploy Solvinter Astro to Pages
on:
  push:
    branches: [astro-preview-2026-11-05]
    paths:
      - 'astro/**'
      - '.github/workflows/deploy-astro.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: python3 tools/generate_english.py
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: astro/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
