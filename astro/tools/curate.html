<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Solvinter · privat ateljé</title><style>*{box-sizing:border-box}body{background:#f7f5ef;color:#282d29;margin:30px;font:15px/1.6 system-ui}header{border-bottom:1px solid #ccc;padding-bottom:20px}h1{font:48px Georgia;margin:15px 0}button,input,select{font:inherit;padding:9px;border:1px solid #b7ae98;background:#fff;color:#282d29;border-radius:2px}button{cursor:pointer}button:hover{background:#eee7d6}button[aria-pressed=true]{background:#333e34;color:white}label{display:inline-block;margin:8px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;margin-top:25px}article{border-bottom:1px solid #ccc;padding-bottom:20px}img{width:100%;height:215px;object-fit:contain;background:#e9e6de}p{overflow-wrap:anywhere}small{color:#625e52}#notice{color:#6d582d}#more{display:block;margin:30px auto}.actions{display:flex;gap:4px;flex-wrap:wrap}a{color:inherit}</style><header><small>SOLVINTER / PRIVAT ATELJÉ</small><h1>Collection 001</h1><p>Granska, välj och ordna. Originalen förblir orörda. Godkänt här betyder valt för samlingen, inte godkänt för publicering.</p><p id="summary">Läser arkivet…</p><label>Sök filnamn, datum eller egen anteckning <input id="search" type="search"></label><label>Visa <select id="filter"><option value="all">Alla</option><option value="pending">Ej granskade</option><option value="approved">Godkända</option><option value="rejected">Avvisade</option><option value="flagged">Tekniska granskningsförslag</option><option value="duplicates">Exakta dubbletter</option></select></label><label>Sortera <select id="sort"><option value="file">Filnamn</option><option value="date">Fotodatum</option><option value="brightness">Ljusstyrka</option><option value="color">Färg</option><option value="landscape">Bredd/höjd</option><option value="order">Samlingens ordning</option></select></label><label>Samling <input id="collection" value="Collection 001"></label><button id="export">Spara samling som JSON</button><label>Öppna samling <input type="file" id="import" accept="application/json"></label><p id="notice" role="status">Beslut sparas i den här webbläsaren. Exportera en JSON-fil för beständig säkerhetskopia. Motivsökning kommer senare.</p></header><div id="grid"></div><button id="more" hidden>Visa fler</button><script>
let data=[],decisions={},limit=60,key='solvinter-curation-v1';const $=id=>document.getElementById(id);try{decisions=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(decisions))}catch{$('notice').textContent='Kunde inte spara i webbläsaren. Exportera JSON för att behålla dina beslut.'}}
function decision(id){return decisions[$('collection').value]?.[id]||{status:'pending',note:'',order:0}}
function change(id,field,value){const c=$('collection').value;decisions[c]??={};decisions[c][id]={...decision(id),[field]:value};save()}
function draw(){let q=$('search').value.toLowerCase(),f=$('filter').value,s=$('sort').value;let list=data.filter(r=>{let d=decision(r.id);return (r.file+' '+r.date+' '+d.note).toLowerCase().includes(q)&&(f==='all'||f==='flagged'&&r.flags.length||f==='duplicates'&&r.duplicates.length||d.status===f)});list.sort((a,b)=>s==='brightness'?a.brightness-b.brightness:s==='color'?a.color[0]-a.color[2]-(b.color[0]-b.color[2]):s==='landscape'?b.width/b.height-a.width/a.height:s==='order'?decision(a.id).order-decision(b.id).order:String(a[s]||'').localeCompare(String(b[s]||'')));$('summary').textContent=`${data.length} bilder · ${list.length} i vyn · ${data.filter(r=>decision(r.id).status==='approved').length} godkända i ${$('collection').value}`;$('grid').replaceChildren();for(const r of list.slice(0,limit)){let d=decision(r.id),el=document.createElement('article'),im=document.createElement('img');im.src=r.thumb;im.alt=r.file;im.loading='lazy';el.append(im);let p=document.createElement('p');p.textContent=r.file;el.append(p);let meta=document.createElement('small');meta.textContent=`${r.width} × ${r.height} · ${r.date||'Fotodatum saknas'} · ${r.flags.join(', ')}${r.duplicates.length?' · exakt dubblett':''}${r.similar.length?' · möjlig likhet':''}`;el.append(meta);let actions=document.createElement('div');actions.className='actions';for(const [status,label] of [['approved','Godkänn'],['rejected','Avvisa'],['pending','Återställ']]){let b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(d.status===status));b.onclick=()=>{change(r.id,'status',status);draw()};actions.append(b)}el.append(actions);let note=document.createElement('input');note.placeholder='Motiv, serie eller anteckning';note.setAttribute('aria-label','Anteckning för '+r.file);note.value=d.note;note.onchange=()=>change(r.id,'note',note.value);el.append(note);let order=document.createElement('input');order.type='number';order.min='0';order.value=d.order;order.setAttribute('aria-label','Ordning för '+r.file);order.onchange=()=>change(r.id,'order',Number(order.value));el.append(order);$('grid').append(el)}$('more').hidden=limit>=list.length}
for(const id of ['search','filter','sort','collection'])$(id).oninput=()=>{limit=60;draw()};$('more').onclick=()=>{limit+=60;draw()};$('export').onclick=()=>{let name=$('collection').value;let blob=new Blob([JSON.stringify({version:1,collection:name,publicationApproved:false,decisions:decisions[name]||{},images:data.filter(r=>decision(r.id).status==='approved').map(r=>({id:r.id,file:r.file,sha256:r.sha256,...decision(r.id)})).sort((a,b)=>a.order-b.order)},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='solvinter-collection.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async()=>{try{let obj=JSON.parse(await $('import').files[0].text());if(obj.version!==1||typeof obj.collection!=='string'||!obj.decisions||typeof obj.decisions!=='object')throw Error('Ogiltig samlingsfil');for(let v of Object.values(obj.decisions))if(!['pending','approved','rejected'].includes(v.status)||typeof v.note!=='string'||typeof v.order!=='number')throw Error('Ogiltiga beslut');decisions[obj.collection]={...(decisions[obj.collection]||{}),...obj.decisions};$('collection').value=obj.collection;save();draw()}catch(e){$('notice').textContent='Kunde inte öppna samlingen: '+e.message}};fetch('inventory.json').then(r=>{if(!r.ok)throw Error('Inventeringen saknas');return r.json()}).then(d=>{data=d.images;draw()}).catch(e=>$('summary').textContent=e.message);
</script></html>
